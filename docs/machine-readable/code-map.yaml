core_modules:
  - path: src/gsc_mcp/server.py
    role: "FastMCP instance; registers every function from registry.TOOLS"
    type: entry_point

  - path: src/gsc_mcp/registry.py
    role: "Shared MCP and CLI registry for all 81 tools"
    exports: [TOOLS]

  - path: src/gsc_mcp/cli.py
    role: "Flag-only CLI generated from registered function signatures"

  - path: src/gsc_mcp/auth.py
    role: "Google credential resolution, GA4 property resolution, Bing env-key reader"
    exports: [get_bing_api_key, get_searchconsole_service, get_indexing_service, get_ga4_service, get_alpha_ga4_service]
    env_vars: [GSC_SERVICE_ACCOUNT_PATH, GSC_CREDENTIALS_PATH, GSC_SKIP_OAUTH, GA4_PROPERTY_ID, BING_WEBMASTER_API_KEY]

  - path: src/gsc_mcp/meta.py
    role: "Output contract: with_meta(data, tool, params) wrapper"
    exports: [with_meta]

  - path: src/gsc_mcp/retry.py
    role: "Retry decorator for transient Google API errors"
    exports: [with_retry]
    retries_on: [429, 500, 502, 503, 504, ServiceUnavailable, ResourceExhausted, InternalServerError, BadGateway, RetryError]

  - path: src/gsc_mcp/quota.py
    role: "In-process Google Indexing API quota counter"
    exports: [QuotaTracker]
    note: "resets on process restart"

  - path: src/gsc_mcp/constants.py
    role: "Shared scopes, quotas and CTR benchmarks"

  - path: src/gsc_mcp/url_safety.py
    role: "SSRF, DNS-rebinding and cloud-metadata protection for external URL fetches"
    exports: [validate_url, validate_url_strict, validate_same_origin, safe_httpx_get, safe_fetch_html]

provider_modules:
  - path: src/gsc_mcp/providers/__init__.py
    role: "Factory exposing only google and bing search providers"
    exports: [get_search_provider]

  - path: src/gsc_mcp/providers/base.py
    role: "Minimal normalized search metrics protocol"
    exports: [SearchEngine, SearchMetricRow, SearchMetricBatch, SearchMetricsProvider, UnsupportedProviderFeature]
    shared_metrics: [date, query, page, clicks, impressions, ctr, position]
    provider_specific_field: provider_metrics

  - path: src/gsc_mcp/providers/google.py
    role: "Google Search Console metrics adapter"
    dimensions: [query, page, date, country, device]
    window_exact: true

  - path: src/gsc_mcp/providers/bing.py
    role: "Redacted Bing JSON/HTTP client and metrics adapter"
    dimensions: [query, page, date]
    window_exact: false
    env_vars: [BING_WEBMASTER_API_KEY]
    transport_rules:
      - "fixed JSON/HTTP endpoint and method allowlists"
      - "no redirects"
      - "15-second operation deadline"
      - "redacted BingApiError"

