name: Python CI

# Repository policy allows owner-requested manual executions only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and smoke-test wheel
    # Keep the owner-only guard even when repository policy is unavailable.
    if: github.actor_id == '3902606' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project and validation tools
        run: python -m pip install --disable-pip-version-check ".[dev,content]" build twine

      - name: Run full Python suite
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/gsc-mcp-smoke"
          "$RUNNER_TEMP/gsc-mcp-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gsc-mcp-smoke/bin/gsc-cli" list > /dev/null

  verify-site:
    name: Validate site without deployment
    if: github.actor_id == '3902606' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project for catalogue export
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: site
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify site
        working-directory: site
        run: pnpm verify
