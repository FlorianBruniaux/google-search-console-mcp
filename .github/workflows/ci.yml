name: Python CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and smoke-test wheel
    # Automatic runs are limited to the owner's same-repository PRs.
    # The owner can dispatch this workflow on another reviewed branch manually.
    if: >-
      github.actor_id == '3902606' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.user.id == 3902606 &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project and validation tools
        run: python -m pip install --disable-pip-version-check ".[dev,content]" build twine

      - name: Run full Python suite
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke-test installed wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/gsc-mcp-smoke"
          "$RUNNER_TEMP/gsc-mcp-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gsc-mcp-smoke/bin/gsc-cli" list > /dev/null
