name: Deploy Search Console MCP site

# Repository policy allows owner-requested manual executions only.
on:
  workflow_dispatch:

concurrency:
  group: search-console-mcp-pages
  cancel-in-progress: false

jobs:
  build:
    # Match the CI guard even when repository policy is unavailable.
    if: github.actor_id == '3902606' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python project
        run: python -m pip install ".[dev]"

      - name: Verify product data exporter and deployment policy
        run: pytest tests/test_site_product_data.py tests/test_site_workflow.py -q

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: site
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify and build site
        working-directory: site
        run: pnpm verify

      - name: Record deployment provenance
        run: >-
          printf '{"sha":"%s","runId":"%s"}\n'
          "$GITHUB_SHA" "$GITHUB_RUN_ID"
          > site/dist/deployment.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist/

  deploy:
    needs: build
    # A reviewed branch may be built manually, but only main can be published.
    if: >-
      github.actor_id == '3902606' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
